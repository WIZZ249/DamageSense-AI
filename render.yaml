services:
  - type: web
    name: damagesense-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --timeout 120 --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: damagesense-db
          property: connectionString
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://damagesense-ai-1.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: DamageSense AI

databases:
  - name: damagesense-db
    plan: free
    postgresMajorVersion: "17"
