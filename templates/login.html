<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DamageSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#07111f; --panel:#101d30; --border:#254064; --accent:#3b82f6; --text:#e5edf7; --muted:#91a1b7; --danger:#ef4444; --green:#22c55e; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; background: #07111f; color: var(--text); font-family: Inter, sans-serif; display: grid; place-items: center; padding: 24px; }
        .auth-shell { width: min(100%, 420px); }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; font-weight: 700; font-size: 1.2rem; }
        .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--green); }
        .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 30px; box-shadow: 0 24px 80px rgba(0,0,0,0.28); }
        h1 { font-size: 1.45rem; margin-bottom: 8px; font-weight: 700; letter-spacing: 0; }
        .lead { color: var(--muted); margin-bottom: 24px; font-size: 0.92rem; }
        label { font-size: 0.82rem; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
        .form-control { background: #0b1728; border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 12px 13px; }
        .form-control:focus { background: #0b1728; color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
        .btn-primary { width: 100%; background: var(--accent); border: 0; border-radius: 7px; padding: 12px; font-weight: 700; margin-top: 8px; }
        .alert { border-radius: 7px; padding: 10px 12px; font-size: 0.86rem; }
        .alert-error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.28); color: #fecaca; }
        .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.28); color: #bbf7d0; }
        .switch { margin-top: 18px; text-align: center; color: var(--muted); font-size: 0.9rem; }
        a { color: #93c5fd; text-decoration: none; font-weight: 600; }
        a:hover { color: var(--text); }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="brand"><span class="dot"></span>DamageSense <span style="color:var(--accent)">AI</span></div>
        <section class="auth-card">
            <h1>Welcome back</h1>
            <p class="lead">Sign in to open your private assessment workspace.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post">
                <div class="mb-3">
                    <label for="identity">Username or email</label>
                    <input class="form-control" id="identity" name="identity" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
            <div class="switch">No account yet? <a href="{{ url_for('main.register') }}">Create one</a></div>
        </section>
    </main>
</body>
</html>
