<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DamageSense AI | Humanitarian Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .hero-section { background: linear-gradient(135deg, #1e293b 0%, #0b0f19 100%); padding: 60px 0; border-bottom: 1px solid #334155; }
        .card { background-color: #161e2d; border: 1px solid #334155; color: white; border-radius: 16px; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .bg-critical { background-color: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
        .bg-stable { background-color: #064e3b; color: #d1fae5; border: 1px solid #10b981; }
        .partner-logo { filter: grayscale(1) brightness(1.5); opacity: 0.5; height: 35px; transition: 0.4s; }
        .partner-logo:hover { filter: grayscale(0) brightness(1); opacity: 1; }
    </style>
</head>
<body>
    <div class="hero-section mb-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="fw-bold display-5">?? DamageSense <span class="text-primary">AI</span></h1>
                    <p class="text-secondary fs-5">Advanced Infrastructure Integrity Monitoring</p>
                </div>
                <a href="/upload" class="btn btn-primary btn-lg px-5 shadow-lg fw-bold" style="border-radius: 12px;">+ New Assessment</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row g-4">
            {% for report in reports %}
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="{{ url_for('static', filename='uploads/' + report.filename) }}" class="card-img-top" style="height: 220px; object-fit: cover;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 text-primary">{{ report.status }}</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-secondary small">Confidence: <b class="text-white">{{ report.confidence }}</b></span>
                            <span class="status-badge {% if report.severity == 'Critical' %}bg-critical{% else %}bg-stable{% endif %}">
                                {{ report.severity }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-5 pt-5 pb-4">
            <h6 class="text-uppercase tracking-widest text-secondary mb-4 small fw-bold" style="letter-spacing: 2px;">Strategic Partners</h6>
            <div class="d-flex justify-content-center flex-wrap gap-5 align-items-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/UNICEF_logo.svg" class="partner-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ee/UN_emblem_blue.svg" class="partner-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Amazon_Web_Services_Logo.svg" class="partner-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Microsoft_Azure_Logo.svg" class="partner-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="partner-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/World_Health_Organization_Logo.svg" class="partner-logo">
            </div>
        </div>
    </div>
</body>
</html>
