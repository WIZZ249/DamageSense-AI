<!DOCTYPE html>
<html>
<head>
    <title>DamageSense Dashboard</title>
</head>
<body style="background: #121212; color: white; font-family: sans-serif; padding: 40px;">
    <h2>🌍 Humanitarian Damage Assessment</h2>
    <a href="/upload" style="background: #27ae60; ...">+ New Assessment</a>
    <table border="1" style="width: 100%; margin-top: 20px; border-collapse: collapse; background: #1a1a1a;">
        <tr style="background: #333;">
            <th>Image</th>
            <th>File Name</th>
            <th>AI Status</th>
        </tr>
        {% for report in reports %}
        <tr>
            <td><img src="{{ url_for('static', filename='uploads/' + report.filename) }}" width="100"></td>
            <td>{{ report.filename }}</td>
            <td><strong>{{ report.status }}</strong></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
