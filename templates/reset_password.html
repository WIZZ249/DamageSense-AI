<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | DamageSense AI</title><style>body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:#08111f;color:#f4f7fb;font:16px system-ui,sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #29415f;border-radius:18px;background:#101e32;box-shadow:0 24px 70px #0005}h1{margin:0 0 8px;font-size:1.45rem}p{color:#8f9bad;font-size:.9rem;line-height:1.55}label{display:block;margin:18px 0 7px;color:#b8c1ce;font-size:.8rem;font-weight:700}input{width:100%;padding:12px;border:1px solid #29415f;border-radius:9px;background:#08111f;color:#f4f7fb;box-sizing:border-box}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#55d6d2;color:#07151c;font-weight:800}.flash{margin-top:14px;padding:10px;border-radius:8px;color:#ffc1c6;background:#ff747e18;border:1px solid #ff747e44;font-size:.8rem}</style></head><body><main class="card"><h1>Set a new password</h1><p>Choose a new password with at least 8 characters. This reset link can only be used once.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Update password</button></form></main></body></html>
