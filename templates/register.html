<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css', v='glass-3') }}">
    <title>Register | DamageSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; font-family: Inter, sans-serif; display: grid; place-items: center; padding: 24px; }
        .auth-shell { width: min(100%, 460px); }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; font-weight: 700; font-size: 1.2rem; }
        .dot { width: 9px; height: 9px; border-radius: 999px; background: #34d399; box-shadow: 0 0 12px rgba(52,211,153,.6); }
        .auth-card { padding: 30px; }
        h1 { font-size: 1.45rem; margin-bottom: 8px; font-weight: 700; letter-spacing: 0; }
        .lead { color: var(--theme-muted); margin-bottom: 24px; font-size: 0.92rem; }
        label { display: block; font-size: 0.82rem; color: var(--theme-muted); font-weight: 600; margin-bottom: 7px; }
        .form-control { width: 100%; padding: 12px 13px; }
        .field-wrap { position: relative; }
        .field-wrap .form-control { padding-right: 42px; }
        .toggle-visibility { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none !important; border: none !important; color: var(--theme-muted) !important; font-size: .78rem; font-weight: 600; padding: 6px 8px !important; cursor: pointer; letter-spacing: .02em; }
        .toggle-visibility:hover { color: var(--theme-blue) !important; }
        .btn-primary { width: 100%; border: 0; padding: 12px; font-weight: 800; margin-top: 8px; }
        .btn-primary[disabled] { opacity: .7; cursor: progress; }
        .alert { border-radius: 12px; padding: 10px 12px; font-size: 0.86rem; margin-bottom: 14px; }
        .switch { margin-top: 18px; text-align: center; color: var(--theme-muted); font-size: 0.9rem; }
        .strength-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0%; border-radius: 999px; background: #f43f5e; transition: width .25s ease, background-color .25s ease; }
        .strength-label { font-size: .74rem; color: var(--theme-muted); margin-top: 5px; display: block; min-height: 1em; }
        .match-hint { font-size: .74rem; margin-top: 5px; display: block; min-height: 1em; }
        .match-hint.ok { color: #34d399; }
        .match-hint.bad { color: #f43f5e; }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="brand"><span class="dot"></span>DamageSense <span style="color:var(--theme-blue-strong)">AI</span></div>
        <section class="auth-card">
            <h1>Create your account</h1>
            <p class="lead">Your uploads and assessments stay attached to your login.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" id="register-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <div class="field-wrap">
                        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                        <button type="button" class="toggle-visibility" data-target="password">SHOW</button>
                    </div>
                    <div class="strength-track"><div class="strength-fill" id="strength-fill"></div></div>
                    <span class="strength-label" id="strength-label"></span>
                </div>
                <div class="mb-3">
                    <label for="confirm_password">Confirm password</label>
                    <div class="field-wrap">
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
                        <button type="button" class="toggle-visibility" data-target="confirm_password">SHOW</button>
                    </div>
                    <span class="match-hint" id="match-hint"></span>
                </div>
                <button class="btn btn-primary" type="submit">Create Account</button>
            </form>
            <div class="switch">Already registered? <a href="{{ url_for('main.login') }}">Login</a></div>
        </section>
    </main>
    <script>
        document.querySelectorAll('.toggle-visibility').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var field = document.getElementById(btn.dataset.target);
                var showing = field.type === 'text';
                field.type = showing ? 'password' : 'text';
                btn.textContent = showing ? 'SHOW' : 'HIDE';
            });
        });

        var pw = document.getElementById('password');
        var fill = document.getElementById('strength-fill');
        var label = document.getElementById('strength-label');
        var colors = ['#f43f5e', '#f97316', '#eab308', '#34d399', '#34d399'];
        var labels = ['Very weak', 'Weak', 'Okay', 'Strong', 'Very strong'];
        pw.addEventListener('input', function () {
            var v = pw.value;
            var score = 0;
            if (v.length >= 8) score++;
            if (v.length >= 12) score++;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
            if (/\d/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            score = Math.min(score, 5);
            var pct = v.length === 0 ? 0 : Math.max(15, score * 20);
            fill.style.width = pct + '%';
            fill.style.background = colors[Math.max(score - 1, 0)];
            label.textContent = v.length === 0 ? '' : labels[Math.max(score - 1, 0)];
        });

        var confirm = document.getElementById('confirm_password');
        var hint = document.getElementById('match-hint');
        function checkMatch() {
            if (!confirm.value) { hint.textContent = ''; hint.className = 'match-hint'; return; }
            if (confirm.value === pw.value) {
                hint.textContent = 'Passwords match';
                hint.className = 'match-hint ok';
            } else {
                hint.textContent = 'Passwords do not match yet';
                hint.className = 'match-hint bad';
            }
        }
        confirm.addEventListener('input', checkMatch);
        pw.addEventListener('input', checkMatch);

        document.getElementById('register-form').addEventListener('submit', function (e) {
            var btn = e.currentTarget.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Creating account…';
        });
    </script>
</body>
</html>
