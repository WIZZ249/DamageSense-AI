<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | DamageSense AI><style>body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:#08111f;color:#f4f7fb;font:16px system-ui,sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #29415f;border-radius:18px;background:#101e32;box-shadow:0 24px 70px #0005}h1{margin:0 0 8px;font-size:1.45rem}p{color:#8f9bad;font-size:.9rem;line-height:1.55}label{display:block;margin:20px 0 7px;color:#b8c1ce;font-size:.8rem;font-weight:700}input{width:100%;padding:12px;border:1px solid #29415f;border-radius:9px;background:#08111f;color:#f4f7fb;box-sizing:border-box}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:#55d6d2;color:#07151c;font-weight:800}a{display:block;margin-top:18px;color:#55d6d2;text-align:center;text-decoration:none;font-size:.85rem}.flash{margin-top:14px;padding:10px;border-radius:8px;color:#b9f6ce;background:#6dde9a18;border:1px solid #6dde9a44;font-size:.8rem}</style></head><body><main class="card"><h1>Reset your password</h1><p>Enter your account email. If an active account matches it, we’ll send a one-time reset link.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Account email</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Send reset link</button></form><a href="{{ url_for('main.login') }}">Back to login</a></main></body></html>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
