<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Assessment | DamageSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; min-height: 100vh; }
        .upload-card { background-color: #161e2d; border: 1px solid #334155; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; margin: auto; }
        .partner-logo { filter: grayscale(1) brightness(1.5); opacity: 0.4; height: 30px; margin: 10px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="upload-card shadow-lg">
            <h2 class="fw-bold mb-4">?? New Assessment</h2>
            <p class="text-secondary mb-4">Submit structural imagery for AI analysis.</p>
            
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <div class="mb-4">
                    <input type="file" name="file" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3" style="border-radius: 12px;">RUN AI ANALYSIS</button>
                <a href="/" class="text-decoration-none text-secondary small">? Back to Dashboard</a>
            </form>

            <div class="mt-5 border-top border-secondary pt-4">
                <div class="d-flex justify-content-center flex-wrap">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/UNICEF_logo.svg" class="partner-logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ee/UN_emblem_blue.svg" class="partner-logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Amazon_Web_Services_Logo.svg" class="partner-logo">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
